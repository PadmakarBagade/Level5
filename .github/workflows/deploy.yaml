name: deploy to ec2
on:
  push:
    branches:
      - main

jobs:
  deploy:
    # it will run this file on ubuntu-latest virtual environment
    runs-on: ubuntu-latest

    steps:
      # it will checkout the code from the repository
      - name: Checkout code
        uses: actions/checkout@v6

      - name: deploy via ssh
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ubuntu
          key: ${{ secrets.KEY }}

          # the script to run on the remote server
          script: |
            cd ~/Level5
            git pull origin main
            sudo docker compose down
            sudo docker compose up -d --build
